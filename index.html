<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starfield Console Command & Workbench Master Lookup v2</title>
<style>
  :root {
    --bg-main: #0b0f17;
    --bg-panel: #131a26;
    --bg-row-alt: #17202f;
    --bg-hover: #1e2a3d;
    --accent: #e06c35;
    --accent-hover: #f2824b;
    --cyan: #38bdf8;
    --purple: #c084fc;
    --green: #22c55e;
    --yellow: #eab308;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --border: #263349;
    --font-mono: 'Consolas', 'Cascadia Code', 'Courier New', monospace;
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: var(--font-sans);
    line-height: 1.5;
    padding: 20px;
  }

  .container {
    max-width: 1380px;
    margin: 0 auto;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 14px;
    margin-bottom: 20px;
    gap: 12px;
  }

  h1 {
    font-size: 1.45rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge-verified {
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid var(--green);
    color: var(--green);
    font-size: 0.72rem;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }

  .badge-workbench {
    background: rgba(192, 132, 252, 0.15);
    border: 1px solid var(--purple);
    color: var(--purple);
    font-size: 0.72rem;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }

  /* Control Deck */
  .controls-deck {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 18px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 14px;
    align-items: end;
    position: sticky;
    top: 10px;
    z-index: 100;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
  }

  @media (max-width: 860px) {
    .controls-deck {
      grid-template-columns: 1fr;
    }
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .input-group label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 600;
  }

  input[type="text"], input[type="number"], select {
    background: #080c12;
    border: 1px solid var(--border);
    color: #fff;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 0.98rem;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    border-color: var(--cyan);
  }

  #searchInput {
    width: 100%;
    font-family: var(--font-mono);
  }

  .qty-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #qtyInput {
    width: 105px;
    font-family: var(--font-mono);
    font-weight: bold;
    color: var(--cyan);
    text-align: center;
  }

  .qty-preset {
    background: #0d131d;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.78rem;
    padding: 8px 9px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .qty-preset:hover {
    border-color: var(--cyan);
    color: #fff;
  }

  .options-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: center;
  }

  .toggle-label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }

  .toggle-label input {
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  .batch-btn {
    background: rgba(192, 132, 252, 0.14);
    border: 1px solid var(--purple);
    color: var(--purple);
    font-family: var(--font-mono);
    font-size: 0.78rem;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 600;
  }

  .batch-btn:hover {
    background: var(--purple);
    color: #000;
  }

  /* Table Styling */
  .table-wrap {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th {
    background: #0d131d;
    color: var(--text-muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(38, 51, 73, 0.5);
    font-size: 0.92rem;
    vertical-align: middle;
  }

  tr:nth-child(even) {
    background-color: var(--bg-row-alt);
  }

  tr:hover {
    background-color: var(--bg-hover);
  }

  .item-name {
    font-weight: 600;
    color: #fff;
  }

  .cat-tag {
    display: inline-block;
    font-size: 0.72rem;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(56, 189, 248, 0.12);
    color: var(--cyan);
    border: 1px solid rgba(56, 189, 248, 0.25);
    white-space: nowrap;
  }

  .cat-tag.cat-upgrade {
    background: rgba(192, 132, 252, 0.14);
    color: var(--purple);
    border-color: rgba(192, 132, 252, 0.35);
  }

  .cat-tag.cat-currency {
    background: rgba(224, 108, 53, 0.15);
    color: var(--accent-hover);
    border-color: rgba(224, 108, 53, 0.35);
  }

  .audit-tag {
    display: inline-block;
    font-size: 0.68rem;
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 6px;
    font-weight: 600;
  }

  .audit-new {
    background: rgba(192, 132, 252, 0.18);
    color: var(--purple);
    border: 1px solid rgba(192, 132, 252, 0.4);
  }

  .audit-fixed {
    background: rgba(234, 179, 8, 0.15);
    color: var(--yellow);
    border: 1px solid rgba(234, 179, 8, 0.35);
  }

  .audit-warn {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.35);
  }

  .hex-id {
    font-family: var(--font-mono);
    color: var(--text-muted);
    font-size: 0.88rem;
  }

  .cmd-btn {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #070a0f;
    border: 1px solid var(--border);
    color: var(--green);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    padding: 7px 12px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.12s ease;
    text-align: left;
  }

  .cmd-btn:hover {
    border-color: var(--accent);
    background: #0f1520;
    color: #4ade80;
  }

  .cmd-btn .copy-pill {
    font-family: var(--font-sans);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--border);
    color: var(--text-main);
    padding: 2px 8px;
    border-radius: 3px;
    margin-left: 10px;
    flex-shrink: 0;
  }

  .cmd-btn.copied {
    border-color: var(--green);
    background: rgba(34, 197, 94, 0.15);
  }

  .cmd-btn.copied .copy-pill {
    background: var(--green);
    color: #000;
    font-weight: 700;
  }

  .notes-col {
    color: var(--text-muted);
    font-size: 0.82rem;
  }

  .empty-state {
    padding: 40px;
    text-align: center;
    color: var(--text-muted);
  }
</style>
</head>

<div class="container">
  <header>
    <h1>
      <span>Starfield Console Lookup Terminal</span>
      <span class="badge-verified">INARA / ESM AUDITED</span>
      <span class="badge-workbench">PURE WORKBENCH EDITION (NO OMOD/AMOD)</span>
    </h1>
    <div style="font-size: 0.82rem; color: var(--text-muted);">
      Press <strong>~</strong> in-game &bull; Click any command or press <strong>Enter</strong> to copy top match
    </div>
  </header>

  <div class="controls-deck">
    <div class="input-group">
      <label for="searchInput">Instant Lookup (Item Name, Upgrade Module, X-Tech, Astra, Resource, or Hex ID)</label>
      <input type="text" id="searchInput" placeholder="e.g. X-Tech, 2033e3d, Astra, Melee Damage, Range Upgrade, Inflictor, 55cc..." autofocus>
    </div>

    <div class="input-group">
      <label for="categorySelect">Category Filter</label>
      <select id="categorySelect">
        <option value="ALL">All Categories</option>
        <option value="Workbench Upgrade">Workbench Upgrade Modules & X-Tech</option>
        <option value="Currency & Utility">Currencies, Astra & Utilities</option>
        <option value="Ammo">Ammunition</option>
        <option value="Weapon">Ranged & Melee Weapons</option>
        <option value="Resource - Inorganic">Resources: Inorganic (Elements)</option>
        <option value="Resource - Organic">Resources: Organic</option>
        <option value="Resource - Manufactured">Resources: Manufactured Components</option>
        <option value="Aid & Pharma">Aid, Stims & Pharmaceuticals</option>
        <option value="Food & Drink">Food, Gastronomy & Drinks</option>
        <option value="Spacesuit & Armor">Spacesuits, Packs & Helmets</option>
        <option value="Apparel & Hats">Clothing, Outfits & Hats</option>
      </select>
    </div>

    <div class="input-group">
      <label for="qtyInput">Quantity & Presets</label>
      <div class="qty-wrap">
        <input type="number" id="qtyInput" value="10" min="1" max="999999">
        <button type="button" class="qty-preset" onclick="setQty(1)">1</button>
        <button type="button" class="qty-preset" onclick="setQty(10)">10</button>
        <button type="button" class="qty-preset" onclick="setQty(100)">100</button>
        <button type="button" class="qty-preset" onclick="setQty(1000)">1K</button>
      </div>
    </div>
  </div>

  <div class="options-bar">
    <div class="toggles">
      <label class="toggle-label" title="Strips leading zeros and lowercases hex (e.g., player.additem 2033e3d 100)">
        <input type="checkbox" id="shortHexToggle" checked>
        Compact Hex (<code>player.additem 2033e3d 10</code>)
      </label>
      <button type="button" class="batch-btn" id="copyUpgradeBatchBtn" onclick="copyUpgradeBatch()" title="Copies a single semicolon-separated console line that adds X-Tech + all 13 Workbench Upgrade Modules at once">
        Copy All Workbench Upgrades & X-Tech (One-Line Batch)
      </button>
    </div>
    <div id="countDisplay">Showing 0 items</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width: 27%;">Item Name</th>
          <th style="width: 15%;">Category</th>
          <th style="width: 11%;">Full FormID</th>
          <th style="width: 29%;">Quick Copy Console Command</th>
          <th style="width: 18%;">Effects / Workbench Notes</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

const searchInput = document.getElementById('searchInput');
const categorySelect = document.getElementById('categorySelect');
const qtyInput = document.getElementById('qtyInput');
const shortHexToggle = document.getElementById('shortHexToggle');
const tableBody = document.getElementById('tableBody');
const countDisplay = document.getElementById('countDisplay');

function setQty(val) {
  qtyInput.value = val;
  renderTable();
}

function formatHex(fullHex, useShort) {
  if (!useShort) return fullHex.toLowerCase();
  const stripped = fullHex.replace(/^0+/, '');
  return (stripped || '0').toLowerCase();
}

function buildCommand(item, qty, useShort) {
  const hex = formatHex(item.id, useShort);
  return `player.additem ${hex} ${qty}`;
}

function copyText(text, btnElement) {
  navigator.clipboard.writeText(text).then(() => {
    const pill = btnElement.querySelector('.copy-pill');
    const origText = pill.textContent;
    btnElement.classList.add('copied');
    pill.textContent = 'COPIED!';
    setTimeout(() => {
      btnElement.classList.remove('copied');
      pill.textContent = origText;
    }, 1100);
  });
}

function copyUpgradeBatch() {
  const qty = Math.max(1, parseInt(qtyInput.value, 10) || 100);
  const useShort = shortHexToggle.checked;
  const upgradeIds = [
    "02033E3D", "003197E2", "003197DE", "003197DC", "003197E5",
    "003197DF", "003197E7", "003197E4", "003197E1", "003197E6",
    "003197DB", "003197E0", "003197DD", "003197E3"
  ];
  const batchCmd = upgradeIds.map(id => `player.additem ${formatHex(id, useShort)} ${qty}`).join('; ');
  const btn = document.getElementById('copyUpgradeBatchBtn');
  navigator.clipboard.writeText(batchCmd).then(() => {
    const orig = btn.textContent;
    btn.textContent = `COPIED 14-COMMAND WORKBENCH BATCH (QTY ${qty})!`;
    setTimeout(() => { btn.textContent = orig; }, 1600);
  });
}

function renderTable() {
  const query = searchInput.value.trim().toLowerCase();
  const cat = categorySelect.value;
  const qty = Math.max(1, parseInt(qtyInput.value, 10) || 10);
  const useShort = shortHexToggle.checked;

  const filtered = ITEMS.filter(item => {
    if (cat !== 'ALL' && item.cat !== cat) return false;
    if (!query) return true;
    const shortId = formatHex(item.id, true);
    return (
      item.name.toLowerCase().includes(query) ||
      item.cat.toLowerCase().includes(query) ||
      item.id.toLowerCase().includes(query) ||
      shortId.includes(query) ||
      (item.note && item.note.toLowerCase().includes(query))
    );
  });

  countDisplay.textContent = `Showing ${filtered.length} of ${ITEMS.length} verified inventory items`;

  if (filtered.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="5" class="empty-state">No matching Starfield items found for "${searchInput.value}".</td></tr>`;
    return;
  }

  tableBody.innerHTML = filtered.map(item => {
    const cmd = buildCommand(item, qty, useShort);
    let badgeHtml = '';
    if (item.isNew) {
      badgeHtml = `<span class="audit-tag audit-new" title="Added in v2 overhaul">NEW ASSET</span>`;
    } else if (item.fixed) {
      badgeHtml = `<span class="audit-tag audit-fixed" title="ID was audited and verified against Starfield ESM">AUDITED FIX</span>`;
    } else if (item.warn) {
      badgeHtml = `<span class="audit-tag audit-warn" title="See note for details">NOTE</span>`;
    }

    let catClass = 'cat-tag';
    if (item.cat === 'Workbench Upgrade') catClass += ' cat-upgrade';
    if (item.cat === 'Currency & Utility') catClass += ' cat-currency';

    return `
      <tr>
        <td>
          <span class="item-name">${item.name}</span>
          ${badgeHtml}
        </td>
        <td><span class="${catClass}">${item.cat}</span></td>
        <td class="hex-id">${item.id}</td>
        <td>
          <button class="cmd-btn" onclick="copyText('${cmd}', this)" title="Click to copy to clipboard">
            <span>${cmd}</span>
            <span class="copy-pill">Copy</span>
          </button>
        </td>
        <td class="notes-col">${item.note || ''}</td>
      </tr>
    `;
  }).join('');
}

// Press Enter in search box to immediately copy the top result
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const firstBtn = tableBody.querySelector('.cmd-btn');
    if (firstBtn) firstBtn.click();
  }
});

searchInput.addEventListener('input', renderTable);
categorySelect.addEventListener('change', renderTable);
qtyInput.addEventListener('input', renderTable);
shortHexToggle.addEventListener('change', renderTable);

// Initial render
renderTable();
</script>
